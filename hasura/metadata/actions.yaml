actions:
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: '{{ACTION_BASE_URL}}/api/actions/trigger-workflow'
      forward_client_headers: true
      headers:
        - name: x-action-secret
          value_from_env: ACTION_SECRET
    permissions:
      - role: owner
      - role: editor
  - name: approveStep
    definition:
      kind: synchronous
      handler: '{{ACTION_BASE_URL}}/api/actions/approve-step'
      forward_client_headers: true
      headers:
        - name: x-action-secret
          value_from_env: ACTION_SECRET
    permissions:
      - role: owner
      - role: editor
custom_types:
  enums: []
  input_objects: []
  objects:
    - name: WorkflowRunPayload
      fields:
        - name: run_id
          type: uuid!
        - name: workflow_id
          type: uuid!
        - name: status
          type: String!
        - name: triggered_by
          type: uuid
        - name: trigger_type
          type: String!
        - name: started_at
          type: timestamptz
        - name: message
          type: String
    - name: StepRunPayload
      fields:
        - name: step_run_id
          type: uuid!
        - name: workflow_run_id
          type: uuid!
        - name: status
          type: String!
        - name: approved_by
          type: uuid
        - name: approved_at
          type: timestamptz
        - name: message
          type: String
  scalars: []
