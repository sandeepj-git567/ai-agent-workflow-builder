table:
  name: workflow_data
  schema: public
object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: organization
    using:
      foreign_key_constraint_on: org_id
select_permissions:
  - role: owner
    permission:
      columns:
        - id
        - workflow_run_id
        - org_id
        - key
        - payload
        - created_at
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: editor
    permission:
      columns:
        - id
        - workflow_run_id
        - org_id
        - key
        - payload
        - created_at
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns:
        - id
        - workflow_run_id
        - org_id
        - key
        - payload
        - created_at
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
