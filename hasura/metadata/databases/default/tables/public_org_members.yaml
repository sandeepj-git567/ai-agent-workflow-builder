table:
  name: org_members
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
select_permissions:
  - role: owner
    permission:
      columns:
        - id
        - user_id
        - org_id
        - role
        - created_at
        - updated_at
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: editor
    permission:
      columns:
        - id
        - user_id
        - org_id
        - role
        - created_at
        - updated_at
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns:
        - id
        - user_id
        - org_id
        - role
        - created_at
        - updated_at
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
insert_permissions:
  - role: owner
    permission:
      check:
        organization:
          org_members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
      columns:
        - user_id
        - org_id
        - role
update_permissions:
  - role: owner
    permission:
      columns:
        - role
      filter:
        organization:
          org_members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
delete_permissions:
  - role: owner
    permission:
      filter:
        organization:
          org_members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: owner
