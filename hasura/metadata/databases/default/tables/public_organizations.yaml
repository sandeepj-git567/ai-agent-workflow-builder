table:
  name: organizations
  schema: public
array_relationships:
  - name: org_members
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: org_members
          schema: public
  - name: workflows
    using:
      foreign_key_constraint_on:
        column: org_id
        table:
          name: workflows
          schema: public
select_permissions:
  - role: owner
    permission:
      columns:
        - id
        - name
        - calls_used
        - calls_allowed
        - quota_period_start
        - created_at
        - updated_at
      filter:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
  - role: editor
    permission:
      columns:
        - id
        - name
        - calls_used
        - calls_allowed
        - quota_period_start
        - created_at
        - updated_at
      filter:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns:
        - id
        - name
        - calls_used
        - calls_allowed
        - quota_period_start
        - created_at
        - updated_at
      filter:
        org_members:
          user_id:
            _eq: X-Hasura-User-Id
update_permissions:
  - role: owner
    permission:
      columns:
        - name
      filter:
        org_members:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - role:
                _eq: owner
