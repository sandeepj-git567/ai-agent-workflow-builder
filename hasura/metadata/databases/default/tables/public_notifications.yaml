table:
  name: notifications
  schema: public
object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: organization
    using:
      foreign_key_constraint_on: org_id
select_permissions:
  - role: owner
    permission:
      columns:
        - id
        - workflow_run_id
        - org_id
        - channel
        - message
        - metadata
        - created_at
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: editor
    permission:
      columns:
        - id
        - workflow_run_id
        - org_id
        - channel
        - message
        - metadata
        - created_at
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns:
        - id
        - workflow_run_id
        - org_id
        - channel
        - message
        - metadata
        - created_at
      filter:
        organization:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id
event_triggers:
  - name: on_notification_created
    definition:
      enable_manual: false
      insert:
        columns: '*'
    retry_conf:
      num_retries: 3
      interval_sec: 10
      timeout_sec: 60
    webhook: '{{ACTION_BASE_URL}}/api/events/notification'
    headers:
      - name: x-action-secret
        value_from_env: ACTION_SECRET
