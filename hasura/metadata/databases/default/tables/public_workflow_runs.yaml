table:
  name: workflow_runs
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: workflow_run_id
        table:
          name: step_runs
          schema: public
  - name: workflow_data
    using:
      foreign_key_constraint_on:
        column: workflow_run_id
        table:
          name: workflow_data
          schema: public
select_permissions:
  - role: owner
    permission:
      columns:
        - id
        - workflow_id
        - triggered_by
        - trigger_type
        - status
        - started_at
        - completed_at
        - error
        - created_at
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
  - role: editor
    permission:
      columns:
        - id
        - workflow_id
        - triggered_by
        - trigger_type
        - status
        - started_at
        - completed_at
        - error
        - created_at
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
  - role: viewer
    permission:
      columns:
        - id
        - workflow_id
        - triggered_by
        - trigger_type
        - status
        - started_at
        - completed_at
        - error
        - created_at
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
